# Railway config-as-code — MA7.7B.
#
# Declares deploy-time settings for the single hosted service described in
# docs/deployment/railway-staging.md; does NOT create any Railway
# resources by itself (a project/service/volume/variables still have to
# be created in Railway, per that runbook, before this file has any
# effect). Builds from the repository's own Dockerfile (see Dockerfile)
# rather than Railway's Railpack auto-detection, because Railpack's Python
# builder does not support this repo's Python 3.8 baseline.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "python -m scripts.hosted_entrypoint"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
# Volumes forbid replicas (MA7.7A finding) -- explicit here so a future
# edit doesn't accidentally reintroduce one.
numReplicas = 1
